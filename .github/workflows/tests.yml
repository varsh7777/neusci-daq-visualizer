# Runs the test suite on Windows, macOS and Linux every time you push, and on
# pull requests. Results: the repo's Actions tab on GitHub (a green tick or a
# red cross next to each commit).
#
# These machines have no USB-6003, so this checks installing, the window,
# review, export, Trials and .mat opening, all with the simulated device.
# Recording from real hardware still has to be tried by hand.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:        # a "Run workflow" button on the Actions tab

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # one system failing shouldn't hide the others' results
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen    # no screen on these machines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -X faulthandler -m pytest -q
